repos:
  - repo: local
    hooks:
      - id: structure-check
        name: Check repo structure, headers, JSDoc, and docs
        entry: node scripts/check-structure.mjs
        language: system
        pass_filenames: false
      - id: eslint
        name: Run ESLint with zero warnings
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: typecheck
        name: Run TypeScript strict typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
      - id: format-check
        name: Check Prettier formatting
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: check-secrets
        name: Scan tracked files for accidental secrets
        entry: bash scripts/check-secrets.sh
        language: system
        pass_filenames: false
