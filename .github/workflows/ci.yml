name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Tests, Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Guard package-lock.json sync
        run: npm ci --dry-run

      - name: Install dependencies
        run: npm ci

      - name: Run repository secret & env hygiene scan
        run: bash scripts/check-secrets.sh

      - name: Check repository size (< 10 MB)
        run: |
          SIZE_KB=$(du -sk --exclude=.git --exclude=node_modules --exclude=.next . | cut -f1)
          echo "Tracked workspace size: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -ge 10240 ]; then
            echo "ERROR: Repository exceeds 10 MB budget"
            exit 1
          fi

      - name: Run full verification gate
        run: npm run verify

      - name: Verify test suite repeatability (3 consecutive runs)
        run: |
          for i in 1 2 3; do
            echo "Repeatability pass $i/3"
            npm run test
          done

      - name: Install Playwright Chromium for E2E & a11y
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E and Accessibility tests
        run: npm run test:e2e

  security-scan:
    name: CodeQL & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - name: Run Gitleaks secret history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
