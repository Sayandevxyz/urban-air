name: CI Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Tests, Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Guard package-lock.json sync
        run: npm ci --dry-run

      - name: Install dependencies
        run: npm ci

      - name: Check repository size (< 10 MB)
        run: |
          SIZE_KB=$(du -sk --exclude=.git --exclude=node_modules --exclude=.next . | cut -f1)
          echo "Tracked workspace size: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -ge 10240 ]; then
            echo "ERROR: Repository exceeds 10 MB budget"
            exit 1
          fi

      - name: Run full verification gate
        run: npm run verify

      - name: Install Playwright Chromium for E2E & a11y
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E and Accessibility tests
        run: npm run test:e2e
